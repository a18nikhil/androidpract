<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>androidpract</title><style>*{box-sizing:border-box} :root{--bg:#10151d;--card:#1c2633;--border:#303c4b;--text:#f2f5f9;--muted:#a7b3c2;--accent:#3ddc84;--hover:#253344;--code:#111923}html.light{--bg:#f4f6f8;--card:#fff;--border:#dce2e8;--text:#17212d;--muted:#526273;--accent:#16834b;--hover:#eef5f0;--code:#f0f3f7}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;line-height:1.65}.container{max-width:750px;margin:auto;padding:24px 16px}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.logo{font-size:22px;font-weight:700;letter-spacing:-.5px}.theme-toggle{display:flex;align-items:center;justify-content:center;width:42px;height:42px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:12px;cursor:pointer}.theme-toggle svg{width:20px;height:20px}.practical{display:flex;align-items:center;gap:16px;padding:20px 16px;margin-bottom:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;text-decoration:none;color:var(--text)}.practical:hover,.nav-btn:hover{background:var(--hover);border-color:var(--accent)}.number{color:var(--accent);font-size:16px;font-weight:700;min-width:28px}.name{font-size:15px;font-weight:500;line-height:1.5}@media(min-width:768px){.container{padding:45px 24px}.practical{padding:22px 24px}.name{font-size:17px}}

-1.42"/></svg>';const moon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.985 12.486A9 9 0 0 1 11.514 3.015a9 9 0 1 0 9.471 9.471Z"/></svg>';function renderTheme(){let light=document.documentElement.classList.contains('light');toggle.innerHTML=light?moon:sun;toggle.setAttribute('aria-label',light?'Switch to dark mode':'Switch to light mode')}toggle.addEventListener('click',()=>{document.documentElement.classList.toggle('light');try{localStorage.setItem('androidTheme',document.documentElement.classList.contains('light')?'light':'dark')}catch(e){}renderTheme()});renderTheme();</script></body></html>
