
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>androidpract</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #10151d;
    --card: #1c2633;
    --border: #303c4b;
    --text: #f2f5f9;
    --accent: #3ddc84;
    --hover: #253344;
}

body.light {
    --bg: #f4f6f8;
    --card: #ffffff;
    --border: #dce2e8;
    --text: #17212d;
    --accent: #16834b;
    --hover: #eef5f0;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, sans-serif;
    transition: background 0.2s, color 0.2s;
}

.container {
    max-width: 750px;
    margin: 0 auto;
    padding: 24px 16px;
}

/* Header */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
}

.logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
}

.theme-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
}

.theme-toggle svg {
    width: 20px;
    height: 20px;
}

/* Practical Cards */

.practical {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 16px;
    margin-bottom: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    text-decoration: none;
    color: var(--text);
    transition: background 0.2s, border-color 0.2s;
}

.practical:hover {
    background: var(--hover);
    border-color: var(--accent);
}

.number {
    color: var(--accent);
    font-size: 16px;
    font-weight: 700;
    min-width: 28px;
}

.name {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.5;
}

/* Desktop */

@media (min-width: 768px) {
    .container {
        padding: 45px 24px;
    }

    .practical {
        padding: 22px 24px;
    }

    .name {
        font-size: 17px;
    }
}
</style>

<script>
(function () {
    try {
        if (localStorage.getItem("androidTheme") === "light") {
            document.documentElement.classList.add("light");
        }
    } catch (e) {}
})();
</script>

<style>
html.light {
    --bg: #f4f6f8;
    --card: #ffffff;
    --border: #dce2e8;
    --text: #17212d;
    --accent: #16834b;
    --hover: #eef5f0;
}
</style>

</head>

<body>

<div class="container">

    <!-- Header -->

    <header class="header">
        <div class="logo">androidpract</div>

        <button
            class="theme-toggle"
            id="themeToggle"
            type="button"
            aria-label="Toggle theme">
        </button>
    </header>

    <!-- Practicals -->

    <main>

        <a class="practical" href="practicals/p1.html">
            <span class="number">01</span>
            <span class="name">Hello World Application</span>
        </a>

        <a class="practical" href="practicals/p2.html">
            <span class="number">02</span>
            <span class="name">Simple Calculator Application</span>
        </a>

        <a class="practical" href="practicals/p3.html">
            <span class="number">03</span>
            <span class="name">Spinner Application with Images</span>
        </a>

        <a class="practical" href="practicals/p4.html">
            <span class="number">04</span>
            <span class="name">RadioButton Group with Teacher-in-Charge Display</span>
        </a>

        <a class="practical" href="practicals/p5.html">
            <span class="number">05</span>
            <span class="name">Login and Logout Application</span>
        </a>

        <a class="practical" href="practicals/p6.html">
            <span class="number">06</span>
            <span class="name">Uppercase Text Conversion Application</span>
        </a>

        <a class="practical" href="practicals/p7.html">
            <span class="number">07</span>
            <span class="name">TextWatcher Application</span>
        </a>

        <a class="practical" href="practicals/p8.html">
            <span class="number">08</span>
            <span class="name">Background Color Changer Application</span>
        </a>

    </main>

</div>

<script>
const themeToggle = document.getElementById("themeToggle");

const moonIcon = `
<svg viewBox="0 0 24 24" fill="none"
stroke="currentColor" stroke-width="2"
stroke-linecap="round" stroke-linejoin="round">
<path d="M20.985 12.486A9 9 0 0 1 11.514 3.015
9 9 0 1 0 20.985 12.486Z"/>
</svg>`;

const sunIcon = `
<svg viewBox="0 0 24 24" fill="none"
stroke="currentColor" stroke-width="2"
stroke-linecap="round" stroke-linejoin="round">
<circle cx="12" cy="12" r="4"/>
<path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42
m11.3 11.3 1.42 1.42M2 12h2m16 0h2
M4.93 19.07l1.42-1.42
m11.3-11.3 1.42-1.42"/>
</svg>`;

function updateThemeIcon() {
    const isLight =
        document.documentElement.classList.contains("light");

    themeToggle.innerHTML = isLight ? moonIcon : sunIcon;

    themeToggle.setAttribute(
        "aria-label",
        isLight ? "Switch to dark mode" : "Switch to light mode"
    );
}

themeToggle.addEventListener("click", function () {
    document.documentElement.classList.toggle("light");

    const isLight =
        document.documentElement.classList.contains("light");

    try {
        localStorage.setItem(
            "androidTheme",
            isLight ? "light" : "dark"
        );
    } catch (e) {}

    updateThemeIcon();
});

updateThemeIcon();
</script>

</body>
</html>
